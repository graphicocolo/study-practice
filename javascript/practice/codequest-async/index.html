<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript 非同期処理の練習問題10選</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basecoat-css@0.3.11/dist/basecoat.cdn.min.css">
    <script src="https://cdn.jsdelivr.net/npm/basecoat-css@0.3.11/dist/js/all.min.js" defer></script>
    <script src="script.js" type="module"></script>
</head>
<body>
  <div class="m-auto max-w-md p-4">
    <h1 class="text-2xl font-bold mb-6">JavaScript 非同期処理の練習問題10選</h1>
    <section class="mb-6 pb-4 border-b-1 border-b-gray-200 text-center">
      <h2 class="text-xl font-bold mb-2">fetchでAPIからデータ取得（Promise）</h2>
      <button id="btn1" type="button" class="btn btn-primary font-bold text-base bg-sky-600 min-w-xs">データ取得（then）</button>
    </section>
    <section class="mb-6 pb-4 border-b-1 border-b-gray-200 text-center">
      <h2 class="text-xl font-bold mb-2">async/awaitでAPI取得</h2>
      <button id="btn2" type="button" class="btn btn-primary font-bold text-base bg-sky-600 min-w-xs">データ取得（async/await）</button>
    </section>
    <section class="mb-6 pb-4 border-b-1 border-b-gray-200 text-center">
      <h2 class="text-xl font-bold mb-2">ネットワークエラーをハンドリング</h2>
      <button id="btn3" type="button" class="btn btn-primary font-bold text-base bg-sky-600 min-w-xs">エラーテスト</button>
    </section>
    <section class="mb-6 pb-4 border-b-1 border-b-gray-200 text-center">
      <h2 class="text-xl font-bold mb-2">複数のAPIを順番に取得する</h2>
      <button id="btn4" type="button" class="btn btn-primary font-bold text-base bg-sky-600 min-w-xs">2件取得（順番）</button>
    </section>
    <section class="mb-6 pb-4 border-b-1 border-b-gray-200 text-center">
      <h2 class="text-xl font-bold mb-2">複数のAPIを順番に取得する</h2>
      <button id="btn5" type="button" class="btn btn-primary font-bold text-base bg-sky-600 min-w-xs">2件取得（同時）</button>
    </section>
    <section class="mb-6 pb-4 border-b-1 border-b-gray-200 text-center">
      <h2 class="text-xl font-bold mb-2">setTimeoutで遅延表示</h2>
      <button id="btn6" type="button" class="btn btn-primary font-bold text-base bg-sky-600 min-w-xs">3秒後に表示</button>
      <p id="msg6"></p>
    </section>
    <section class="mb-6 pb-4 border-b-1 border-b-gray-200 text-center">
      <h2 class="text-xl font-bold mb-2">ローディング表示 → API取得後に表示</h2>
      <button id="btn7" type="button" class="btn btn-primary font-bold text-base bg-sky-600 min-w-xs">データを取得</button>
      <p id="result7"></p>
    </section>
    <section class="mb-6 pb-4 border-b-1 border-b-gray-200 text-center">
      <h2 class="text-xl font-bold mb-2">ボタン連打を防ぐ（多重実行対策）</h2>
      <button id="btn8" type="button" class="btn btn-primary font-bold text-base bg-sky-600 min-w-xs">送信する</button>
      <p id="status8"></p>
    </section>
    <form>
      <section class="mb-6 pb-4 border-b-1 border-b-gray-200 text-center">
        <h2 class="text-xl font-bold mb-2">データをPOST送信して結果を表示</h2>
        <input type="text" id="input9" placeholder="名前を入力" class="input mb-2">
        <button id="btn9" type="button" class="btn btn-primary font-bold text-base bg-sky-600 min-w-xs">送信する</button>
        <p id="status9"></p>
      </section>
    </form>
    <section class="mb-6 pb-4 border-b-1 border-b-gray-200 text-center">
      <h2 class="text-xl font-bold mb-2">ユーザーID入力でAPIから情報を取得</h2>
      <input type="text" id="input10" placeholder="ユーザーID (1~10)" class="input mb-2">
      <button id="btn10" type="button" class="btn btn-primary font-bold text-base bg-sky-600 min-w-xs">ユーザー取得</button>
      <p id="userInfo10"></p>
    </section>
  </div>
</body>
</html>
